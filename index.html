<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b6b61">
  <meta name="description" content="Dingel Hafizia Madrasa Professional Management System">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./logo.png">
  <link rel="stylesheet" href="./style.css">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/js/all.min.js"></script>
  <title>Dingel Hafizia Madrasa — ERP</title>
  <style>
    #loginScreen{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:18px;background:linear-gradient(145deg,#edf8f5,#f7fafb)}
    #loginScreen.hidden{display:none}
    .login-card{width:min(430px,100%);background:#fff;border:1px solid #e2e8ea;border-radius:26px;padding:30px 24px;box-shadow:0 18px 55px #102e2c16;text-align:center}
    .login-card img{width:105px;height:105px;object-fit:contain;margin-bottom:10px}
    .login-card h1{margin:0;color:#17202d;font-size:25px}
    .login-card p{margin:7px 0 22px;color:#697586;font-size:13px}
    .login-card input{width:100%;height:52px;border:1px solid #dce2e9;border-radius:11px;padding:0 14px;font-size:16px;outline:none}
    .login-card input:focus{border-color:#0b6b61;box-shadow:0 0 0 3px #0b6b6115}
    .login-card button{width:100%;margin-top:12px}
    #loginError{min-height:20px;color:#dc2626;font-size:12px;margin-top:7px}
    .login-note{font-size:10px;color:#8a969c;margin-top:16px;line-height:1.5}
  </style>
</head>
<body>

<!-- Compatibility login. This is NOT Firebase Authentication. -->
<section id="loginScreen">
  <div class="login-card">
    <img src="./logo.png" alt="Dingel Hafizia Madrasa">
    <h1>Dingel Hafizia Madrasa</h1>
    <p>Professional Madrasa Management System</p>
    <form id="loginForm" autocomplete="on">
      <input id="loginPassword" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Enter password" required>
      <div id="loginError"></div>
      <button class="btn primary" type="submit">
        <i class="fa-solid fa-right-to-bracket"></i> Login to Dashboard
      </button>
    </form>
    <div class="login-note">Compatibility login only. For real production use, replace this with Firebase Authentication and restrictive security rules.</div>
  </div>
</section>

<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo"><img src="./logo.png" alt="Logo" style="width:43px;height:43px;border-radius:13px;object-fit:contain;background:#fff;padding:2px"></div>
      <div><b id="brandName">ডিঙ্গেল হাফিজিয়া মাদ্রাসা</b><small>Management System</small></div>
    </div>

    <div class="profile-mini">
      <div class="avatar">DH</div>
      <div><b>Administrator</b><small id="cloudState">Local / Offline</small></div>
    </div>

    <nav id="nav"></nav>

    <div class="side-bottom">
      <button class="navbtn" data-page="settings"><i class="fa-solid fa-gear"></i> Settings</button>
      <button class="navbtn danger" id="logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="iconbtn mobile" id="menu"><i class="fa-solid fa-bars"></i></button>
      <div>
        <h2 id="pageTitle">Dashboard</h2>
        <small id="dateText"></small>
      </div>
      <div class="topright">
        <button class="iconbtn" id="searchBtn" title="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button class="iconbtn" id="themeBtn" title="Theme"><i class="fa-solid fa-moon"></i></button>
        <button class="iconbtn" id="printBtn" title="Print"><i class="fa-solid fa-print"></i></button>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>

<div id="modal"></div>
<div id="toast"></div>

<script>
  /* Keep the existing Firebase configuration here if your project uses one. */
  window.FIREBASE_CONFIG = window.FIREBASE_CONFIG || {
    apiKey: "",
    authDomain: "",
    projectId: "",
    storageBucket: "",
    messagingSenderId: "",
    appId: ""
  };
</script>

<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
(function(){
  const KEY = "dhm_login_ok";
  const PASSWORD = "123";
  const login = document.getElementById("loginScreen");
  const form = document.getElementById("loginForm");
  const input = document.getElementById("loginPassword");
  const error = document.getElementById("loginError");

  function showApp(){
    login.classList.add("hidden");
    document.body.style.overflow = "";
  }

  function showLogin(){
    login.classList.remove("hidden");
    input.value = "";
    input.focus();
  }

  if(localStorage.getItem(KEY) === "1") showApp();

  form.addEventListener("submit", function(e){
    e.preventDefault();
    if(input.value.trim() === PASSWORD){
      localStorage.setItem(KEY, "1");
      error.textContent = "";
      showApp();
      if(typeof window.__DHM_START__ === "function") window.__DHM_START__();
    }else{
      error.textContent = "ভুল password — আবার চেষ্টা করুন।";
      input.focus();
      input.select();
    }
  });

  window.__DHM_LOGIN_SHOW__ = showLogin;
})();
</script>

<script src="./app.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", function(){
    const logout = document.getElementById("logout");
    if(logout){
      logout.addEventListener("click", function(){
        localStorage.removeItem("dhm_login_ok");
        location.reload();
      });
    }
  });

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./service-worker.js", {scope:"./"})
        .catch(function(e){ console.warn("Service worker:", e); });
    });
  }
</script>

</body>
</html>
