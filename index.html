<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b6b61">
  <meta name="description" content="Dingel Hafizia Madrasa professional management system">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./logo.png">
  <title>Dingel Hafizia Madrasa ERP</title>

  <!-- Firebase SDK. The existing configuration is supplied in the FIREBASE_CONFIG
       object below. If your project uses a different Firebase SDK setup, keep
       the same object and update only the SDK versions/config as required. -->
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    :root{
      --primary:#0b6b61;--primary2:#0f8174;--ink:#17212b;--muted:#71808a;
      --bg:#f4f7f8;--card:#fff;--line:#e2e8ea;--danger:#c73c3c;
      --success:#08785f;--warning:#9a6a00;--shadow:0 12px 32px rgba(21,42,51,.08);
      --radius:18px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;min-height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .hidden{display:none!important}
    .login-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#edf8f5,#f7f9fa)}
    .login-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:var(--shadow);text-align:center}
    .login-logo{width:100px;height:100px;object-fit:contain;margin-bottom:14px}
    .login-card h1{margin:5px 0;font-size:25px}.login-card p{color:var(--muted);margin:8px 0 25px}
    .login-card input{width:100%;height:52px;border:1px solid var(--line);border-radius:13px;padding:0 15px;outline:none}
    .login-card input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(11,107,97,.1)}
    .login-error{color:var(--danger);font-size:13px;min-height:20px;margin:9px 0}
    .login-note{font-size:11px;color:#8a969c;margin-top:18px}
    .app-shell{min-height:100vh;display:flex}
    .sidebar{width:260px;position:fixed;left:0;top:0;bottom:0;background:#102e2c;color:#dbeae7;z-index:50;display:flex;flex-direction:column}
    .brand{padding:23px 18px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.09)}
    .brand img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:12px;padding:3px}
    .brand b{display:block;color:#fff;font-size:15px}.brand small{color:#9fc0ba;font-size:10px}
    .nav{padding:15px 11px;overflow:auto}
    .nav-section{font-size:10px;letter-spacing:1.2px;color:#779f98;padding:12px 11px 7px}
    .nav-item{width:100%;border:0;background:transparent;color:#c8dcda;padding:12px 13px;border-radius:12px;display:flex;align-items:center;gap:11px;text-align:left;margin:2px 0}
    .nav-item:hover,.nav-item.active{background:#18534d;color:#fff}
    .nav-item .ico{width:22px;text-align:center}.nav-item.active .ico{filter:brightness(1.2)}
    .sidebar-footer{margin-top:auto;padding:14px;border-top:1px solid rgba(255,255,255,.09)}
    .connection{font-size:11px;color:#a8c4bf;display:flex;gap:7px;align-items:center;padding:8px}
    .dot{width:8px;height:8px;border-radius:50%;background:#38c793}.dot.offline{background:#e2a52b}
    .logout{width:100%;border:1px solid rgba(255,255,255,.12);background:transparent;color:#d9e8e5;border-radius:10px;padding:10px}
    .main{margin-left:260px;width:calc(100% - 260px);min-width:0}
    .topbar{height:82px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:30}
    .top-left{display:flex;align-items:center;gap:14px}.breadcrumb{font-weight:800;font-size:21px}.date-text{font-size:12px;color:var(--muted)}
    .top-actions{display:flex;gap:9px}.icon-btn{width:43px;height:43px;border:1px solid var(--line);background:#fff;border-radius:13px}
    .menu-btn,.sidebar-close,.overlay{display:none}
    #view{padding:28px;max-width:1500px;margin:auto}
    .page{animation:fade .16s ease}@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
    .head{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:20px}.head h1{font-size:27px;margin:0 0 5px}.head p{margin:0;color:var(--muted);font-size:13px}
    .hero{background:linear-gradient(135deg,#e4f4f1,#f7fbfa);border:1px solid #d8ebe7;border-radius:22px;padding:25px;display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:20px}
    .hero h1{margin:5px 0 7px;font-size:27px}.hero p{margin:0;color:#5d7373}.eyebrow{font-size:10px;letter-spacing:1.5px;color:var(--primary);font-weight:800}
    .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 13px;font-weight:700;font-size:12px}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.primary:hover{background:#08584f}.btn.ghost:hover{border-color:var(--primary);color:var(--primary)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 16px rgba(20,40,50,.025)}.stat-icon{width:42px;height:42px;border-radius:12px;background:#eef7f5;display:grid;place-items:center;font-size:19px}.stat-copy small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.stat-copy strong{font-size:18px}.red{color:var(--danger)!important}.green{color:var(--success)!important}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:19px;margin-bottom:18px;box-shadow:0 5px 20px rgba(20,40,50,.025)}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.cardhead b{font-size:14px}
    .quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick button{border:1px solid var(--line);background:#fbfcfc;border-radius:13px;padding:15px;text-align:left;font-weight:700;color:var(--ink);display:flex;gap:9px;align-items:center}.quick button:hover{border-color:#b6d8d3;background:#f2faf8}
    .summary>div{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px dashed var(--line);font-size:13px}.summary>div:last-child{border:0}.summary span{color:var(--muted)}
    .toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.toolbar input,.toolbar select{height:43px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:0 12px;outline:none;min-width:190px}.toolbar input{flex:1}
    .mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.mini-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.mini-box small{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.mini-box strong{font-size:17px}
    .tablewrap{overflow:auto}.tablewrap table{width:100%;border-collapse:collapse;min-width:850px}.tablewrap th,.tablewrap td{padding:12px 10px;border-bottom:1px solid #edf0f1;text-align:left;vertical-align:middle;font-size:12px}.tablewrap th{color:#6c7a81;background:#fafcfc;font-size:10px;text-transform:uppercase;letter-spacing:.5px}.tablewrap tr:hover td{background:#fbfdfd}.tablewrap small{display:block;color:var(--muted);margin-top:2px;font-size:10px}
    .person{display:flex;gap:9px;align-items:center}.mini{width:35px;height:35px;border-radius:10px;background:#e6f3f0;color:var(--primary);display:grid;place-items:center;font-weight:800}
    .tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2f3;color:#53636a;font-size:10px;font-weight:800;text-transform:capitalize}.tag.ok{background:#e7f5f1;color:#08785f}.tag.warn{background:#fff2d7;color:#8b6300}
    .empty{text-align:center;padding:25px;color:#78858a}.empty-icon{font-size:25px;margin-bottom:7px}.empty small{display:block;margin-top:5px}
    .section-title{font-size:17px;margin:25px 0 13px}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.field{min-width:0}.field.full{grid-column:1/-1}.field label{display:block;font-size:11px;font-weight:800;color:#5f7077;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;outline:none;background:#fff;color:var(--ink)}.field textarea{resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(11,107,97,.08)}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}
    .details-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.detail{background:#f8fafb;border:1px solid #edf0f1;border-radius:10px;padding:10px}.detail small{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.detail b{font-size:12px;overflow-wrap:anywhere}
    .profile{display:grid;grid-template-columns:220px 1fr;gap:18px}.profile-hero{background:linear-gradient(145deg,#e8f6f3,#f7fbfa);border:1px solid #d8ebe7;border-radius:17px;padding:22px;text-align:center;align-self:start}.profile-photo{width:90px;height:90px;border-radius:25px;background:#fff;color:var(--primary);font-size:35px;font-weight:900;display:grid;place-items:center;margin:0 auto 12px}.profile-hero h2{margin:0 0 3px}.profile-hero p{font-size:11px;color:var(--muted);margin:4px}
    .modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px}.modal.hidden{display:none}.modal-backdrop{position:absolute;inset:0;background:rgba(11,23,29,.56);backdrop-filter:blur(3px)}.modal-card{position:relative;width:min(1000px,100%);max-height:92vh;overflow:auto;background:#f5f8f8;border-radius:20px;box-shadow:0 25px 80px rgba(0,0,0,.25)}.modal-head{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--line);padding:15px 19px;display:flex;align-items:center;justify-content:space-between}.modal-head h2{font-size:17px;margin:0}.modal-close{width:35px;height:35px;border:0;background:#f0f3f4;border-radius:9px;font-size:20px}.modal-body{padding:18px}
    .toast-container{position:fixed;right:20px;bottom:20px;z-index:200;display:flex;flex-direction:column;gap:8px}.toast{background:#16312f;color:#fff;padding:12px 15px;border-radius:11px;box-shadow:var(--shadow);font-size:12px}.toast.error{background:#a72f2f}
    @media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.mini-grid{grid-template-columns:repeat(2,1fr)}.form-grid.three{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:800px){
      .sidebar{transform:translateX(-105%);transition:.22s ease;box-shadow:20px 0 50px rgba(0,0,0,.2)}.sidebar.open{transform:none}.main{margin-left:0;width:100%}.overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:.2s}.overlay.open{opacity:1;pointer-events:auto}.menu-btn,.sidebar-close{display:grid;place-items:center}.menu-btn{width:43px;height:43px;border:1px solid var(--line);background:#fff;border-radius:13px;font-size:22px}.sidebar-close{margin-left:auto;width:35px;height:35px;border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:9px}.brand{padding-top:17px}.topbar{height:75px;padding:0 14px}.breadcrumb{font-size:17px}.date-text{display:none}#view{padding:17px 13px}.hero{padding:18px;align-items:flex-start}.hero h1{font-size:22px}.hero .btn{white-space:nowrap}.grid2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:12px}.stat-icon{width:36px;height:36px;font-size:16px}.stat-copy strong{font-size:15px}.head{align-items:flex-start}.head h1{font-size:23px}.form-grid,.form-grid.three{grid-template-columns:1fr}.details-grid{grid-template-columns:1fr 1fr}.profile{grid-template-columns:1fr}.modal{padding:8px}.modal-card{max-height:96vh}.modal-body{padding:10px}.card{padding:14px}.quick{grid-template-columns:1fr 1fr}}
    @media(max-width:480px){.top-actions{gap:5px}.top-actions .icon-btn:last-child{display:none}.hero{display:block}.hero .btn{margin-top:14px}.stats{grid-template-columns:1fr 1fr}.mini-grid{grid-template-columns:1fr 1fr}.details-grid{grid-template-columns:1fr}.quick{grid-template-columns:1fr}.form-actions{position:sticky;bottom:0;background:#f5f8f8;padding:10px 0}.toast-container{left:12px;right:12px;bottom:12px}.toast{text-align:center}}
  </style>
</head>

<body>
  <section id="loginScreen" class="login-screen">
    <div class="login-card">
      <img class="login-logo" src="./logo.png" alt="Dingel Hafizia Madrasa">
      <h1>Dingel Hafizia Madrasa</h1>
      <p>Professional Madrasa Management System</p>
      <form id="loginForm">
        <input id="loginPassword" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Enter password" required>
        <div id="loginError" class="login-error"></div>
        <button class="btn primary" style="width:100%;height:50px" type="submit">Login to Dashboard</button>
      </form>
      <div class="login-note">Frontend compatibility login. Use Firebase Authentication for production security.</div>
    </div>
  </section>

  <div id="app" class="app-shell hidden">
    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <img src="./logo.png" alt="Logo">
        <div><b>DINGEL HAFIZIA</b><small>MADRASA ERP</small></div>
        <button id="sidebarClose" class="sidebar-close" aria-label="Close">×</button>
      </div>
      <nav class="nav">
        <div class="nav-section">MAIN</div>
        <button class="nav-item" data-page="dashboard"><span class="ico">⌂</span>Dashboard</button>
        <button class="nav-item" data-page="students"><span class="ico">👨‍🎓</span>Students</button>
        <button class="nav-item" data-page="fees"><span class="ico">💰</span>Fees Management</button>
        <button class="nav-item" data-page="due"><span class="ico">🔴</span>Due Management</button>
        <div class="nav-section">ACCOUNTS</div>
        <button class="nav-item" data-page="income"><span class="ico">📈</span>Income</button>
        <button class="nav-item" data-page="expense"><span class="ico">📉</span>Expenses</button>
        <button class="nav-item" data-page="accounts"><span class="ico">📊</span>Accounts</button>
        <div class="nav-section">REPORTS & SETTINGS</div>
        <button class="nav-item" data-page="reports"><span class="ico">🖨</span>Reports</button>
        <button class="nav-item" data-page="settings"><span class="ico">⚙</span>Madrasa Profile</button>
      </nav>
      <div class="sidebar-footer">
        <div class="connection"><span id="connectionDot" class="dot offline"></span><span id="connectionText">Local / Offline</span></div>
        <button id="logoutButton" class="logout">↪ Logout</button>
      </div>
    </aside>

    <div id="sidebarOverlay" class="overlay"></div>

    <main class="main">
      <header class="topbar">
        <div class="top-left">
          <button id="menuButton" class="menu-btn" aria-label="Open menu" aria-expanded="false">☰</button>
          <div><div id="breadcrumb" class="breadcrumb">Dashboard</div><div id="currentDate" class="date-text"></div></div>
        </div>
        <div class="top-actions">
          <button class="icon-btn" type="button" title="Refresh" onclick="location.reload()">↻</button>
          <button class="icon-btn" type="button" title="Print" onclick="window.print()">🖨</button>
        </div>
      </header>
      <div id="view"></div>
    </main>
  </div>

  <div id="modal" class="modal hidden" aria-hidden="true">
    <div id="modalBackdrop" class="modal-backdrop"></div>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h2 id="modalTitle">Dialog</h2>
        <button id="modalClose" class="modal-close" aria-label="Close">×</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </section>
  </div>
  <div id="toastContainer" class="toast-container"></div>

  <script>
    /*
      IMPORTANT:
      Keep your existing Firebase project configuration here.
      Do not replace it with the example values below.
    */
    window.FIREBASE_CONFIG = window.FIREBASE_CONFIG || {
      apiKey: "",
      authDomain: "",
      projectId: "",
      storageBucket: "",
      messagingSenderId: "",
      appId: ""
    };
  </script>
  <script src="./app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js", { scope: "./" })
          .catch(function (error) { console.warn("Service worker registration failed:", error); });
      });
    }
  </script>
</body>
</html>
