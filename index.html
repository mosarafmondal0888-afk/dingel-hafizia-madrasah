<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b6b61">
  <meta name="description" content="Dingel Hafizia Madrasa Professional ERP">
  <title>Dingel Hafizia Madrasa — Professional ERP</title>
  <link rel="icon" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>
  <script src="js/firebase/config.js" onerror="window.FIREBASE_CONFIG=window.FIREBASE_CONFIG||{}"></script>
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="logo.png" class="brand-logo" onerror="this.style.display='none'">
      <div><b>ডিঙ্গেল হাফিজিয়া মাদ্রাসা</b><small>Professional ERP</small></div>
    </div>
    <div class="admin-card"><span class="avatar">DH</span><div><b>Administrator</b><small id="cloudState">Local / Offline</small></div></div>
    <nav id="nav"></nav>
    <div class="side-footer">
      <button class="navbtn" data-page="settings">⚙️ <span>Settings</span></button>
      <button class="navbtn danger" id="logoutBtn">↪ <span>Logout</span></button>
    </div>
  </aside>

  <div class="overlay" id="overlay"></div>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn mobile-only" id="menuBtn">☰</button>
      <div><div class="eyebrow">DINGEL HAFIZIA MADRASA</div><h2 id="pageTitle">Dashboard</h2><small id="dateText"></small></div>
      <div class="top-actions">
        <button class="icon-btn" id="themeBtn" title="Theme">◐</button>
        <button class="icon-btn" id="printBtn" title="Print">⎙</button>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script src="app.js"></script>
</body>
</html>
